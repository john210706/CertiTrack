spring.application.name=certitrack
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/certitrack}
spring.datasource.username=${DB_USERNAME:certitrack}
spring.datasource.password=${DB_PASSWORD:}
# Convenient for the college demo; use validate with a managed schema outside development.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
certitrack.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
certitrack.expiry.enabled=${EXPIRY_ENABLED:true}
certitrack.expiry.cron=${EXPIRY_CRON:0 0 0 * * *}
